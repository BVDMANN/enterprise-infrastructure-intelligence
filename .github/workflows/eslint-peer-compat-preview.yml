name: ESLint peer compatibility lockfile preview

on:
  push:
    branches:
      - phase1/p1-a5-eslint9-peer-compat
    paths:
      - apps/web/package.json
      - .github/workflows/eslint-peer-compat-preview.yml

permissions:
  contents: read

jobs:
  web-peer-compatibility:
    name: Generate ESLint 9 lockfile preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Regenerate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Report lockfile digest
        working-directory: apps/web
        run: sha256sum package-lock.json

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eslint9-lockfile
          path: apps/web/package-lock.json
          retention-days: 1

      - name: Emit lockfile for GitHub API handoff
        working-directory: apps/web
        shell: bash
        run: |
          echo LOCKFILE_B64_BEGIN
          base64 -w 76 package-lock.json
          echo LOCKFILE_B64_END
