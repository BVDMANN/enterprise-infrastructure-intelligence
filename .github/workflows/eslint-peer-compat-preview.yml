name: ESLint peer compatibility lockfile preview

on:
  push:
    branches:
      - phase1/p1-a5-eslint9-peer-compat
    paths:
      - apps/web/package.json
      - .github/workflows/eslint-peer-compat-preview.yml

permissions:
  contents: read

jobs:
  web-peer-compatibility:
    name: Regenerate lockfile and validate Web toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install from regenerated lockfile
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Verify ESLint peer tree
        working-directory: apps/web
        run: npm ls eslint eslint-plugin-react eslint-plugin-jsx-a11y

      - name: Web tests, lint, typecheck and build
        working-directory: apps/web
        run: |
          npm run test:api
          npm run lint
          npm run typecheck
          npm run build

      - name: Report lockfile digest
        working-directory: apps/web
        run: sha256sum package-lock.json

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eslint9-lockfile
          path: apps/web/package-lock.json
          retention-days: 1
