name: CI

on:
  push:
    branches: [main, develop]
  # Toutes les PR, quelle que soit la branche cible : la restriction à
  # main/develop faisait que la PR #3 (cible audit/phase-0) n'avait AUCUN
  # check — les validations ajoutées ne s'exécutaient pas (constaté le 25/11).
  pull_request:

jobs:
  web:
    name: Web (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    name: API (lint / tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m pytest tests -q

  api-postgres-integration:
    name: API PostgreSQL integration (membership concurrency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eii_test
          POSTGRES_USER: eii
          POSTGRES_PASSWORD: eii_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eii -d eii_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://eii_runtime:eii_runtime_test_only@localhost:5432/eii_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://eii_migrator:eii_migrator_test_only@localhost:5432/eii_test
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: eii_test
      PGUSER: eii
      PGPASSWORD: eii_test_only
      EII_RUNTIME_ROLE: eii_runtime
      EII_RUNTIME_PASSWORD: eii_runtime_test_only
      EII_MIGRATOR_ROLE: eii_migrator
      EII_MIGRATOR_PASSWORD: eii_migrator_test_only
      EII_ADOPT_EXISTING_SCHEMA_OWNERSHIP: "false"
      EII_POSTGRES_INTEGRATION: "1"
      EII_POSTGRES_ROLE_SEPARATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Validate PostgreSQL role bootstrap shell syntax
        run: sh -n ../../infrastructure/postgres/bootstrap-roles.sh
      - name: Provision least-privilege PostgreSQL roles
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/infrastructure/postgres:/scripts:ro" \
            --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD \
            --env EII_RUNTIME_ROLE --env EII_RUNTIME_PASSWORD \
            --env EII_MIGRATOR_ROLE --env EII_MIGRATOR_PASSWORD \
            --env EII_ADOPT_EXISTING_SCHEMA_OWNERSHIP \
            postgres:16-alpine /bin/sh /scripts/bootstrap-roles.sh
      - name: Verify PostgreSQL role bootstrap is idempotent
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/infrastructure/postgres:/scripts:ro" \
            --env PGHOST --env PGPORT --env PGDATABASE --env PGUSER --env PGPASSWORD \
            --env EII_RUNTIME_ROLE --env EII_RUNTIME_PASSWORD \
            --env EII_MIGRATOR_ROLE --env EII_MIGRATOR_PASSWORD \
            --env EII_ADOPT_EXISTING_SCHEMA_OWNERSHIP \
            postgres:16-alpine /bin/sh /scripts/bootstrap-roles.sh
      - name: Apply migrations using the dedicated migrator connection
        run: alembic upgrade head
      - name: Verify runtime and migrator role boundaries
        run: python -m pytest tests/test_postgres_role_separation.py -q
      - name: Verify concurrent owner demotions remain serialized
        run: python -m pytest tests/test_membership_postgres_concurrency.py -q

  api-postgres-rls-evaluation:
    name: PostgreSQL RLS evaluation (isolated prototype)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eii_rls_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: eii_rls_poc_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eii_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:eii_rls_poc_only@localhost:5432/eii_rls_test
      EII_POSTGRES_RLS_EVALUATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Verify isolated PostgreSQL RLS policies and transaction cleanup
        run: python -m pytest tests/test_postgres_rls_evaluation.py -q

  compose-validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Assert published ports bind only to localhost
        run: |
          docker compose config --format json > /tmp/eii-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/eii-compose.json").read_text())
          expected = {"db": "5432", "redis": "6379", "api": "8000", "web": "3000"}
          for service, port in expected.items():
              bindings = config["services"][service].get("ports", [])
              matching = [
                  item for item in bindings
                  if str(item.get("target")) == port
                  and str(item.get("published")) == port
              ]
              if len(matching) != 1 or matching[0].get("host_ip") != "127.0.0.1":
                  raise SystemExit(
                      f"{service}: expected exactly one {port}:{port} binding on 127.0.0.1; got {bindings}"
                  )
          print("All published development ports are bound to 127.0.0.1.")
          PY

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build api image
        run: docker build -f infrastructure/docker/api.Dockerfile -t eii-api:test .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t eii-web:test .
      - name: Build worker image
        run: docker build -f infrastructure/docker/worker.Dockerfile -t eii-worker:test .
      - name: Build connector image
        run: docker build -f infrastructure/docker/connector.Dockerfile -t eii-connector:test .
      - name: Verify images run as non-root
        run: |
          for img in eii-api:test eii-web:test eii-worker:test eii-connector:test; do
            user=$(docker run --rm --entrypoint="" "$img" id -u)
            echo "$img runs as uid $user"
            if [ "$user" = "0" ]; then echo "FAIL: $img runs as root"; exit 1; fi
          done

  compose-smoke:
    name: Compose smoke test (up + healthchecks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for healthy services
        run: |
          for svc in api web worker; do
            echo "Waiting for $svc to become healthy..."
            cid=""
            for i in $(seq 1 30); do
              cid=$(docker compose ps -q "$svc")
              if [ -z "$cid" ]; then
                echo "$svc: no running container (not started or already exited)"
                status="missing"
              else
                status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "unknown")
              fi
              if [ "$status" = "healthy" ]; then echo "$svc is healthy"; break; fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "=== $svc did not become healthy (status: $status) ==="
              docker compose ps -a
              echo "=== logs $svc (last 100 lines) ==="
              docker compose logs --tail=100 "$svc" || true
              exit 1
            fi
          done
      - name: Check API and web endpoints
        run: |
          curl -f http://localhost:8000/health
          curl -fs -o /dev/null http://localhost:3000/
          docker compose exec -T worker celery -A app.celery_app.celery_app inspect ping --timeout 5
      - name: Verify database role separation
        run: |
          for role in eii_runtime eii_migrator; do
            role_state=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT CASE WHEN rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole THEN 'unsafe' ELSE 'safe' END FROM pg_roles WHERE rolname='$role';" | tr -d '[:space:]')
            test "$role_state" = "safe"
          done
          runtime_user=$(docker compose exec -T api python -c "from sqlalchemy import text; from app.db.session import engine; connection=engine.connect(); print(connection.scalar(text('SELECT current_user'))); connection.close()")
          test "$runtime_user" = "eii_runtime"
          migration_user=$(docker compose run --rm --no-deps migrate python -c "import os; from sqlalchemy import create_engine, text; connection=create_engine(os.environ['MIGRATION_DATABASE_URL']).connect(); print(connection.scalar(text('SELECT current_user'))); connection.close()")
          test "$migration_user" = "eii_migrator"
          docker compose exec -T api python -c "import os; assert 'MIGRATION_DATABASE_URL' not in os.environ"
          docker compose exec -T worker python -c "import os; assert 'MIGRATION_DATABASE_URL' not in os.environ"
      - name: Verify RBAC backfill, tenant constraint and migration cycle
        run: |
          docker compose run --rm migrate alembic downgrade 0004_user_password_hash
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            INSERT INTO organizations (id, name, slug) VALUES
              ('11111111-1111-4111-8111-111111111111', 'RBAC Smoke A', 'rbac-smoke-a');
            INSERT INTO users (id, email, display_name) VALUES
              ('22222222-2222-4222-8222-222222222222', 'rbac-smoke-a@example.com', 'RBAC Smoke A');
            INSERT INTO memberships (id, organization_id, user_id, role) VALUES
              ('33333333-3333-4333-8333-333333333333',
               '11111111-1111-4111-8111-111111111111',
               '22222222-2222-4222-8222-222222222222', 'owner');
          "
          docker compose run --rm migrate alembic upgrade head
          docker compose run --rm migrate alembic current
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT extname FROM pg_extension WHERE extname='citext';" | tr -d '[:space:]' | grep -qx citext
          role_id=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT role_id FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';" | tr -d '[:space:]')
          test -n "$role_id"
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM memberships m JOIN roles r ON r.id=m.role_id AND r.organization_id=m.organization_id WHERE m.id='33333333-3333-4333-8333-333333333333' AND r.name='owner';" | tr -d '[:space:]' | grep -qx 1
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM role_permissions WHERE role_id='$role_id';" | tr -d '[:space:]' | grep -qx 9
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            INSERT INTO organizations (id, name, slug) VALUES
              ('44444444-4444-4444-8444-444444444444', 'RBAC Smoke B', 'rbac-smoke-b');
            INSERT INTO users (id, email, display_name) VALUES
              ('55555555-5555-4555-8555-555555555555', 'rbac-smoke-b@example.com', 'RBAC Smoke B');
          "
          if cross_tenant_error=$(docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "INSERT INTO memberships (id, organization_id, user_id, role_id) VALUES ('66666666-6666-4666-8666-666666666666', '44444444-4444-4444-8444-444444444444', '55555555-5555-4555-8555-555555555555', '$role_id');" 2>&1); then
            echo "Cross-tenant role assignment unexpectedly succeeded"
            exit 1
          fi
          echo "$cross_tenant_error" | grep -q 'fk_memberships_organization_role'
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            BEGIN;
            INSERT INTO audit_events (id, organization_id, actor_user_id, event_type, details)
            VALUES ('77777777-7777-4777-8777-777777777777',
                    '11111111-1111-4111-8111-111111111111',
                    '22222222-2222-4222-8222-222222222222',
                    'audit.smoke.created', '{}'::jsonb);
            DO \$\$
            BEGIN
              BEGIN
                UPDATE audit_events SET event_type='audit.smoke.mutated'
                WHERE id='77777777-7777-4777-8777-777777777777';
                RAISE EXCEPTION 'Audit UPDATE unexpectedly succeeded';
              EXCEPTION WHEN SQLSTATE '55000' THEN
                RAISE NOTICE 'Audit UPDATE rejected by append-only trigger';
              END;
              BEGIN
                DELETE FROM audit_events
                WHERE id='77777777-7777-4777-8777-777777777777';
                RAISE EXCEPTION 'Audit DELETE unexpectedly succeeded';
              EXCEPTION WHEN SQLSTATE '55000' THEN
                RAISE NOTICE 'Audit DELETE rejected by append-only trigger';
              END;
              BEGIN
                TRUNCATE audit_events;
                RAISE EXCEPTION 'Audit TRUNCATE unexpectedly succeeded';
              EXCEPTION WHEN SQLSTATE '55000' THEN
                RAISE NOTICE 'Audit TRUNCATE rejected by append-only trigger';
              END;
              BEGIN
                INSERT INTO audit_events
                  (id, organization_id, actor_user_id, event_type, details)
                VALUES
                  ('88888888-8888-4888-8888-888888888888',
                   '44444444-4444-4444-8444-444444444444',
                   '22222222-2222-4222-8222-222222222222',
                   'audit.smoke.cross_tenant', '{}'::jsonb);
                RAISE EXCEPTION 'Cross-tenant audit actor unexpectedly succeeded';
              EXCEPTION WHEN foreign_key_violation THEN
                RAISE NOTICE 'Cross-tenant audit actor rejected by composite FK';
              END;
            END;
            \$\$;
            ROLLBACK;
          "
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM audit_events WHERE id='77777777-7777-4777-8777-777777777777';" | tr -d '[:space:]' | grep -qx 0
          docker compose run --rm migrate alembic downgrade 0004_user_password_hash
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT role FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';" | tr -d '[:space:]' | grep -qx owner
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            DELETE FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';
            DELETE FROM users WHERE id IN ('22222222-2222-4222-8222-222222222222', '55555555-5555-4555-8555-555555555555');
            DELETE FROM organizations WHERE id IN ('11111111-1111-4111-8111-111111111111', '44444444-4444-4444-8444-444444444444');
          "
          docker compose run --rm migrate alembic downgrade base

          # The shared citext extension is intentionally retained by the
          # initial migration's downgrade; the Alembic revision itself must
          # be fully removed before a fresh upgrade.
          version_rows=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM alembic_version;" | tr -d '[:space:]')
          echo "Alembic version rows after downgrade: $version_rows"
          test "$version_rows" = "0"
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM pg_extension WHERE extname='citext';" | tr -d '[:space:]' | grep -qx 1

          # Fail if the migration graph unexpectedly has multiple heads.
          expected_heads=$(docker compose run --rm migrate alembic heads | awk 'NF {print $1}')
          head_count=$(echo "$expected_heads" | awk 'NF {count++} END {print count+0}')
          if [ "$head_count" != "1" ]; then
            echo "Expected exactly one Alembic head, found: $expected_heads"
            exit 1
          fi

          # A fresh upgrade followed by a second upgrade must be idempotent.
          docker compose run --rm migrate alembic upgrade head
          docker compose run --rm migrate alembic upgrade head
          actual_revision=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT version_num FROM alembic_version;" | tr -d '[:space:]')
          echo "Expected Alembic head: $expected_heads; actual revision: $actual_revision"
          test "$actual_revision" = "$expected_heads"
          version_rows=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM alembic_version;" | tr -d '[:space:]')
          test "$version_rows" = "1"
          docker compose run --rm migrate alembic current
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('organizations','users','memberships','roles','permissions','role_permissions','audit_events');" | tr -d '[:space:]' | grep -qx 7
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='users' AND column_name='password_hash';" | tr -d '[:space:]' | grep -qx 1
      - name: Check simulation connector ran once
        run: |
          code=$(docker inspect --format='{{.State.ExitCode}}' "$(docker compose ps -aq connector-sim)")
          echo "connector-sim exit code: $code"
          if [ "$code" != "0" ]; then docker compose logs connector-sim; exit 1; fi
      - name: Show stack status
        if: always()
        run: docker compose ps -a
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  security-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Audit Python dependencies (report-only)
        shell: bash
        run: |
          set +e
          python -m pip install pip-audit
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            {
              echo "### Python dependency audit — ERROR"
              echo "pip-audit installation failed (exit code $install_status). This is a tooling error, not a clean audit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$install_status"
          fi

          pip-audit -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r services/worker/requirements.txt -r services/connector/requirements.txt > /tmp/pip-audit.txt 2>&1
          audit_status=$?
          cat /tmp/pip-audit.txt
          if [ "$audit_status" -eq 0 ]; then
            {
              echo "### Python dependency audit — CLEAN"
              echo "pip-audit completed with exit code 0; no known vulnerabilities were reported."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$audit_status" -eq 1 ]; then
            {
              echo "### Python dependency audit — FINDINGS (report-only)"
              echo "pip-audit returned exit code 1. Findings remain unresolved; see the full step log. The CI job is not evidence that this audit is clean."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Python dependency audit — ERROR"
              echo "pip-audit failed with exit code $audit_status. This is a tooling/runtime error, not a report-only vulnerability result."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$audit_status"
          fi

      - name: Audit Node dependencies (report-only)
        shell: bash
        working-directory: apps/web
        run: |
          set +e
          npm audit --audit-level=high --json > /tmp/npm-audit.json 2>&1
          audit_status=$?
          cat /tmp/npm-audit.json
          if [ "$audit_status" -gt 1 ]; then
            {
              echo "### Node dependency audit — ERROR"
              echo "npm audit failed with exit code $audit_status. This is a tooling/runtime error, not a clean audit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$audit_status"
          fi

          AUDIT_EXIT_CODE="$audit_status" node - <<'NODE'
          const fs = require("node:fs");

          let report;
          try {
            report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          } catch (error) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              "### Node dependency audit — ERROR\nThe npm audit output was not valid JSON; inspect the step log.\n",
            );
            console.error("Could not parse npm audit JSON:", error);
            process.exit(2);
          }

          const counts = report.metadata?.vulnerabilities;
          if (!counts || !Number.isInteger(counts.total)) {
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              "### Node dependency audit — ERROR\nThe npm audit report did not contain vulnerability metadata; inspect the step log.\n",
            );
            process.exit(2);
          }

          const names = Object.entries(report.vulnerabilities ?? {}).map(
            ([name, item]) => `- ${name}: ${item.severity}`,
          );
          const summary = [
            counts.total === 0
              ? "### Node dependency audit — CLEAN"
              : "### Node dependency audit — FINDINGS (report-only)",
            `npm audit exit code: ${process.env.AUDIT_EXIT_CODE}`,
            `Total: ${counts.total}; critical: ${counts.critical}; high: ${counts.high}; moderate: ${counts.moderate}; low: ${counts.low}; info: ${counts.info}`,
            ...(names.length ? names : ["No affected package names were returned."]),
            counts.total === 0
              ? "No known vulnerabilities were reported."
              : "Findings remain unresolved. The CI job is not evidence that this audit is clean.",
            "",
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          if (Number(process.env.AUDIT_EXIT_CODE) === 1 && counts.total === 0) {
            console.error("npm audit returned exit code 1 without vulnerability metadata.");
            process.exit(2);
          }
          NODE
