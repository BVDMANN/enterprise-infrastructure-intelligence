name: CI

on:
  push:
    branches: [main, develop]
  # Toutes les PR, quelle que soit la branche cible : la restriction à
  # main/develop faisait que la PR #3 (cible audit/phase-0) n'avait AUCUN
  # check — les validations ajoutées ne s'exécutaient pas (constaté le 25/11).
  pull_request:

jobs:
  web:
    name: Web (lint / typecheck / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    name: API (lint / tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Temporary formatter diff diagnostic (does not change the gate)
        run: ruff format --diff app/routers/organizations.py tests/test_organization_routes.py || true
      - run: ruff format --check app tests
      - run: python -m pytest tests -q

  compose-validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Assert published ports bind only to localhost
        run: |
          docker compose config --format json > /tmp/eii-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/eii-compose.json").read_text())
          expected = {"db": "5432", "redis": "6379", "api": "8000", "web": "3000"}
          for service, port in expected.items():
              bindings = config["services"][service].get("ports", [])
              matching = [
                  item for item in bindings
                  if str(item.get("target")) == port
                  and str(item.get("published")) == port
              ]
              if len(matching) != 1 or matching[0].get("host_ip") != "127.0.0.1":
                  raise SystemExit(
                      f"{service}: expected exactly one {port}:{port} binding on 127.0.0.1; got {bindings}"
                  )
          print("All published development ports are bound to 127.0.0.1.")
          PY

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build api image
        run: docker build -f infrastructure/docker/api.Dockerfile -t eii-api:test .
      - name: Build web image
        run: docker build -f infrastructure/docker/web.Dockerfile -t eii-web:test .
      - name: Build worker image
        run: docker build -f infrastructure/docker/worker.Dockerfile -t eii-worker:test .
      - name: Build connector image
        run: docker build -f infrastructure/docker/connector.Dockerfile -t eii-connector:test .
      - name: Verify images run as non-root
        run: |
          for img in eii-api:test eii-web:test eii-worker:test eii-connector:test; do
            user=$(docker run --rm --entrypoint="" "$img" id -u)
            echo "$img runs as uid $user"
            if [ "$user" = "0" ]; then echo "FAIL: $img runs as root"; exit 1; fi
          done

  compose-smoke:
    name: Compose smoke test (up + healthchecks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for healthy services
        run: |
          for svc in api web worker; do
            echo "Waiting for $svc to become healthy..."
            cid=""
            for i in $(seq 1 30); do
              cid=$(docker compose ps -q "$svc")
              if [ -z "$cid" ]; then
                echo "$svc: no running container (not started or already exited)"
                status="missing"
              else
                status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "unknown")
              fi
              if [ "$status" = "healthy" ]; then echo "$svc is healthy"; break; fi
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "=== $svc did not become healthy (status: $status) ==="
              docker compose ps -a
              echo "=== logs $svc (last 100 lines) ==="
              docker compose logs --tail=100 "$svc" || true
              exit 1
            fi
          done
      - name: Check API and web endpoints
        run: |
          curl -f http://localhost:8000/health
          curl -fs -o /dev/null http://localhost:3000/
          docker compose exec -T worker celery -A app.celery_app.celery_app inspect ping --timeout 5
      - name: Verify RBAC backfill, tenant constraint and migration cycle
        run: |
          docker compose exec -T api alembic upgrade 0004_user_password_hash
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            INSERT INTO organizations (id, name, slug) VALUES
              ('11111111-1111-4111-8111-111111111111', 'RBAC Smoke A', 'rbac-smoke-a');
            INSERT INTO users (id, email, display_name) VALUES
              ('22222222-2222-4222-8222-222222222222', 'rbac-smoke-a@example.com', 'RBAC Smoke A');
            INSERT INTO memberships (id, organization_id, user_id, role) VALUES
              ('33333333-3333-4333-8333-333333333333',
               '11111111-1111-4111-8111-111111111111',
               '22222222-2222-4222-8222-222222222222', 'owner');
          "
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic current
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT extname FROM pg_extension WHERE extname='citext';" | tr -d '[:space:]' | grep -qx citext
          role_id=$(docker compose exec -T db psql -U eii -d eii -tAc "SELECT role_id FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';" | tr -d '[:space:]')
          test -n "$role_id"
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM memberships m JOIN roles r ON r.id=m.role_id AND r.organization_id=m.organization_id WHERE m.id='33333333-3333-4333-8333-333333333333' AND r.name='owner';" | tr -d '[:space:]' | grep -qx 1
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM role_permissions WHERE role_id='$role_id';" | tr -d '[:space:]' | grep -qx 9
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            INSERT INTO organizations (id, name, slug) VALUES
              ('44444444-4444-4444-8444-444444444444', 'RBAC Smoke B', 'rbac-smoke-b');
            INSERT INTO users (id, email, display_name) VALUES
              ('55555555-5555-4555-8555-555555555555', 'rbac-smoke-b@example.com', 'RBAC Smoke B');
          "
          if cross_tenant_error=$(docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "INSERT INTO memberships (id, organization_id, user_id, role_id) VALUES ('66666666-6666-4666-8666-666666666666', '44444444-4444-4444-8444-444444444444', '55555555-5555-4555-8555-555555555555', '$role_id');" 2>&1); then
            echo "Cross-tenant role assignment unexpectedly succeeded"
            exit 1
          fi
          echo "$cross_tenant_error" | grep -q 'fk_memberships_organization_role'
          docker compose exec -T api alembic downgrade 0004_user_password_hash
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT role FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';" | tr -d '[:space:]' | grep -qx owner
          docker compose exec -T db psql -U eii -d eii -v ON_ERROR_STOP=1 -c "
            DELETE FROM memberships WHERE id='33333333-3333-4333-8333-333333333333';
            DELETE FROM users WHERE id IN ('22222222-2222-4222-8222-222222222222', '55555555-5555-4555-8555-555555555555');
            DELETE FROM organizations WHERE id IN ('11111111-1111-4111-8111-111111111111', '44444444-4444-4444-8444-444444444444');
          "
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic current
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('organizations','users','memberships','roles','permissions','role_permissions');" | tr -d '[:space:]' | grep -qx 6
          docker compose exec -T db psql -U eii -d eii -tAc "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='users' AND column_name='password_hash';" | tr -d '[:space:]' | grep -qx 1
      - name: Check simulation connector ran once
        run: |
          code=$(docker inspect --format='{{.State.ExitCode}}' "$(docker compose ps -aq connector-sim)")
          echo "connector-sim exit code: $code"
          if [ "$code" != "0" ]; then docker compose logs connector-sim; exit 1; fi
      - name: Show stack status
        if: always()
        run: docker compose ps -a
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  security-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r apps/api/requirements.txt -r apps/api/requirements-dev.txt -r services/worker/requirements.txt -r services/connector/requirements.txt
      - name: Audit Node dependencies
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --audit-level=high
