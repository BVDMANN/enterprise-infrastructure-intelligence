# docker-compose.yml — Environnement de développement
# Enterprise Infrastructure Intelligence
#
# Usage : cp .env.example .env puis docker compose up --build
# Web : http://localhost:3000 — API : http://localhost:8000 — Docs : http://localhost:8000/docs
# Les ports publiés sont limités à 127.0.0.1 (poste local uniquement).
#
# Les mots de passe par défaut sont des PLACEHOLDERS de développement
# uniquement. Ne jamais les utiliser hors développement.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eii}
      POSTGRES_USER: ${POSTGRES_USER:-eii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eii} -d ${POSTGRES_DB:-eii}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates/normalizes least-privilege application roles. The admin password
  # is confined to this bootstrap container and the PostgreSQL healthcheck.
  db-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/scripts/bootstrap-roles.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-eii}
      PGUSER: ${POSTGRES_USER:-eii}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_dev_only}
      EII_RUNTIME_ROLE: ${POSTGRES_RUNTIME_USER:-eii_runtime}
      EII_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-change_me_runtime_dev_only}
      EII_MIGRATOR_ROLE: ${POSTGRES_MIGRATOR_USER:-eii_migrator}
      EII_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-change_me_migrator_dev_only}
      EII_ADOPT_EXISTING_SCHEMA_OWNERSHIP: ${EII_ADOPT_EXISTING_SCHEMA_OWNERSHIP:-false}
    volumes:
      - ./infrastructure/postgres/bootstrap-roles.sh:/scripts/bootstrap-roles.sh:ro
      - ./infrastructure/postgres/bootstrap-roles.sql:/scripts/bootstrap-roles.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Alembic runs in a separate one-shot container. This container alone gets
  # MIGRATION_DATABASE_URL; the long-running API/Worker never receive it.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_MIGRATOR_USER:-eii_migrator}:${POSTGRES_MIGRATOR_PASSWORD:-change_me_migrator_dev_only}@db:5432/${POSTGRES_DB:-eii}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-eii_runtime}:${POSTGRES_RUNTIME_PASSWORD:-change_me_runtime_dev_only}@db:5432/${POSTGRES_DB:-eii}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-change_me_dev_only}
      API_ENV: development
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    # Démarrage : CMD de l'image (celery -A app.celery_app.celery_app worker).
    # Ne pas surcharger avec command: ici : une seule source de vérité.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_RUNTIME_USER:-eii_runtime}:${POSTGRES_RUNTIME_PASSWORD:-change_me_runtime_dev_only}@db:5432/${POSTGRES_DB:-eii}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Connecteur de SIMULATION — données explicitement simulées (SIMULATED=true).
  # One-shot : il exécute un cycle découverte+synchro puis s'arrête (exit 0).
  # Pas de healthcheck — un service qui s'arrête normalement n'en a pas besoin.
  connector-sim:
    build:
      context: .
      dockerfile: infrastructure/docker/connector.Dockerfile
    environment:
      SIMULATED: "true"
      EII_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
